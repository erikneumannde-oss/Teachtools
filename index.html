<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools für Lehrkräfte</title>
    <style>
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            background-color: #2c3e50;
            color: white;
            width: 100%;
            text-align: center;
            padding: 2rem 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        h1 { margin: 0; font-size: 2.2rem; }
        p.subtitle { margin-top: 10px; font-size: 1.1rem; color: #bdc3c7; }

        main {
            width: 100%;
            max-width: 720px;
            padding: 3rem 20px;
            box-sizing: border-box;
            line-height: 1.6;
        }
        .hinweis {
            background: white;
            border-radius: 12px;
            padding: 1.5rem 2rem;
            border-top: 5px solid #3498db;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        footer {
            margin-top: auto;
            padding: 20px 0;
            width: 100%;
            text-align: center;
        }
        footer a {
            color: #7f8c8d;
            text-decoration: none;
            font-size: 0.9rem;
        }
        footer a:hover {
            color: #3498db;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <h1>Tools für Lehrkräfte</h1>
        <p class="subtitle">Kleine Werkzeuge für den Schulalltag – ohne Anmeldung, ohne Datenübertragung</p>
    </header>

    <main>
        <div class="hinweis">
            <p>Hier entstehen Werkzeuge für Lehrkräfte. Alle Eingaben werden ausschließlich im Browser verarbeitet.</p>
        </div>
    </main>

    <footer>
        <a href="impressum.html">Impressum und Datenschutz</a>
    </footer>

</body>
</html>
